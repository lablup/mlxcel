# Youtu-VL oracle environment (youtu_vl_reference_oracle.py, #3365).
# transformers 5.x cannot import the Youtu remote code (DefaultFastImageProcessorKwargs),
# so this lock pins 4.57.x. It is separate from requirements.lock, which keeps 5.12.1 for
# the SSM and LLaVA oracles. Install:
#   uv venv --python 3.12 .venv-youtu
#   uv pip install --python .venv-youtu -r requirements-youtu.lock \
#       --index-strategy unsafe-best-match --extra-index-url https://download.pytorch.org/whl/cpu
