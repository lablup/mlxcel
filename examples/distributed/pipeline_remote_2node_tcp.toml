[cluster]
name = "remote-pp-tcp"
pipeline_parallel_size = 2
transport_backend = "tcp"
# Pre-shared cluster secret (#2637): every role must hold the same file.
# `openssl rand -hex 32 > cluster.secret`; a relative path is resolved
# against this TOML. `--cluster-secret-file` / MLXCEL_CLUSTER_SECRET_FILE /
# MLXCEL_CLUSTER_SECRET override it. See docs/distributed.md.
secret_file = "cluster.secret"

[[nodes]]
id = "coordinator"
address = "10.0.0.10:19000"
role = "hybrid"

[[nodes]]
id = "stage-0"
address = "10.0.0.10:19001"
role = "pipeline_stage"
stage = 0

[[nodes]]
id = "stage-1"
address = "10.0.0.11:19001"
role = "pipeline_stage"
stage = 1
