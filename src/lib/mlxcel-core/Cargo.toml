[package]
name = "mlxcel-core"
version = "0.8.0-beta.1"
edition = "2024"
authors = ["Jeongkyu Shin"]
description = "Low-level MLX building blocks for mlxcel"
license = "Apache-2.0"

[lib]
crate-type = ["lib"]

[features]
default = []
metal = []
accelerate = []
cuda = []
# AMD GPU (ROCm/HIP) backend through the ROCm overlay in
# ../mlxcelverse/overlays/rocm, on Linux and Windows x86_64 MSVC (issues #1802,
# #2601).
rocm = []

[dependencies]
cxx = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-script = "0.5"
smallvec = { version = "1.13", features = ["serde"] }
sha2 = "0.11"
thiserror = "2.0"
# Default features minus `esaxx_fast`; see the root Cargo.toml (#58).
tokenizers = { version = "0.22.2", default-features = false, features = ["onig", "progressbar"] }
postcard = { version = "1", features = ["alloc"] }
dirs = "6"
libm = "0.2"
tracing = "0.1"

[dev-dependencies]
ctor = "1.0.13"
tempfile = "3"

[build-dependencies]
cxx-build = "1.0"
cmake = "0.1"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"

[[example]]
name = "wht_microbench"
path = "examples/wht_microbench.rs"

# Per-call time and TFLOP/s of the fused ROCm SDPA prefill path at the
# chunked-prefill shapes (issue #2251). Needs a ROCm host; builds only under
# the rocm feature, which carries the overlay link recipe.
[[example]]
name = "sdpa_prefill_probe"
path = "examples/sdpa_prefill_probe.rs"
required-features = ["rocm"]
