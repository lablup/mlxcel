# PR / push CI for the Python client package under python/. Runs ruff (lint +
# format), mypy (type check) once on the pinned interpreter, and pytest (unit
# + lifecycle tests) across a floor/current/ceiling Python version matrix. It
# needs neither MLX nor the mlxcel binary, so it runs on plain GitHub-hosted
# Ubuntu runners and is independent of the Rust CI in ci.yml. The e2e test is
# skipped here because it requires a built binary (set MLXCEL_BIN to run it
# locally).

name: Python

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

jobs:
  lint:
    name: lint, type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && pip install -e "python[dev]"

      - name: Ruff lint
        run: ruff check python

      - name: Ruff format check
        run: ruff format --check python

      - name: Mypy
        run: mypy python/src

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # actions/setup-python has no CPython 3.9 build for Ubuntu 26.04
          # (ubuntu-latest), so the floor version stays on 24.04.
          - python-version: '3.9'
            os: ubuntu-24.04
          - python-version: '3.11'
            os: ubuntu-latest
          - python-version: '3.13'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && pip install -e "python[dev]"

      - name: Pytest (unit + lifecycle)
        run: pytest python/tests -m "not e2e" -q
