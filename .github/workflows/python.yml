# PR / push CI for the Python client package under python/. Runs ruff (lint +
# format), mypy (type check) once on the pinned interpreter, and pytest (unit
# + lifecycle tests) across a Python version matrix that ends at the default
# python3 of the ubuntu-latest image (Ubuntu 26.04 ships 3.14). It needs neither
# MLX nor the mlxcel binary, so it runs on plain ubuntu-latest and is
# independent of the Rust CI in ci.yml. The e2e test is skipped here because it
# requires a built binary (set MLXCEL_BIN to run it locally).

name: Python

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

jobs:
  lint:
    name: lint, type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && pip install -e "python[dev]"

      - name: Ruff lint
        run: ruff check python

      - name: Ruff format check
        run: ruff format --check python

      - name: Mypy
        run: mypy python/src

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the default python3 on Ubuntu 26.04 (ubuntu-latest).
        # actions/setup-python has no CPython 3.9 build for 26.04, so the
        # requires-python floor (>=3.9) is not exercised here.
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && pip install -e "python[dev]"

      - name: Pytest (unit + lifecycle)
        run: pytest python/tests -m "not e2e" -q
