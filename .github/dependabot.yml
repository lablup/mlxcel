# Dependabot configuration for automated dependency updates.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Cargo (Rust) dependencies — unified workspace lock (mlxcel, mlxcel-core, mlxcel-surgery).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "type:dependency"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions dependencies.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    ignore:
      # The tag on this action is the Rust toolchain version it installs, not a
      # version of the action itself, so it has to track `rust-toolchain.toml`'s
      # `channel` and cannot be bumped independently. Dependabot cannot know that
      # and raised it to a Rust release that does not exist, which broke the
      # cargo-fmt job on every Rust-touching PR until it was reverted. Bump both
      # by hand, together.
      - dependency-name: "dtolnay/rust-toolchain"
    labels:
      - "type:dependency"
      - "type:chore"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Python client (python/pyproject.toml). The package declares lower-bound
  # ranges (`openai>=1.40`, `httpx>=0.27`), so the default versioning strategy
  # applies; majors are held back as for Cargo and moved by hand.
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "type:dependency"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Download webpage (webpage/site, pnpm lockfile). `next` and `eslint-config-next`
  # are pinned to the same exact version, so the single minor-and-patch group keeps
  # them moving in one PR.
  - package-ecosystem: "npm"
    directory: "/webpage/site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.72 declares `typescript: >=4.8.4 <6.1.0`, so a TypeScript
      # minor or major breaks the lint toolchain until typescript-eslint accepts it.
      # Only patch releases are taken; bump TypeScript by hand once typescript-eslint
      # moves (the same hold applies to `webui/`).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "type:dependency"
    commit-message:
      prefix: "deps"
      include: "scope"
